<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lequel</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="popup">
    <main class="wrap">
      <header class="head">
        <img src="icons/48.png" alt="" width="28" height="28" />
        <div>
          <h1 id="label">…</h1>
          <p id="email" class="muted"></p>
        </div>
      </header>
      <label class="switch">
        <input id="muted" type="checkbox" />
        <span><strong data-i18n="muted"></strong></span>
      </label>
      <div class="row">
        <span class="muted" data-i18n="lastPing"></span>
        <span id="last" class="value"></span>
      </div>
      <button id="options" type="button" class="link" data-i18n="settingsButton"></button>
    </main>
    <script src="lib/parse.js"></script>
    <script src="lib/config.js"></script>
    <script src="lib/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
