<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lequel — options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="page">
    <main class="wrap">
      <header class="head">
        <img src="icons/48.png" alt="" width="32" height="32" />
        <div>
          <h1>Lequel</h1>
          <p class="muted">Réglages de ce profil Chrome. Chaque profil a les siens.</p>
        </div>
      </header>

      <section class="card">
        <h2>Identité</h2>
        <div class="field">
          <span class="label">Compte détecté</span>
          <output id="email" class="readonly">…</output>
        </div>
        <label class="field">
          <span class="label">Libellé annoncé</span>
          <input id="label" type="text" maxlength="60" autocomplete="off" />
          <span class="hint">Ce que la voix dira après le nom du service, par exemple « Gmail, <em>Serendyme</em> ».</span>
        </label>
      </section>

      <section class="card">
        <h2>Annonce</h2>
        <fieldset class="field">
          <legend class="label">Mode</legend>
          <div class="segmented">
            <label><input type="radio" name="mode" value="voice" /> <span>Voix</span></label>
            <label><input type="radio" name="mode" value="sound" /> <span>Son</span></label>
          </div>
        </fieldset>

        <label class="field" data-mode="sound">
          <span class="label">Motif sonore</span>
          <select id="pattern">
            <option value="ding">Ding — une note</option>
            <option value="double">Double — deux notes</option>
            <option value="triple">Triple — trois notes montantes</option>
            <option value="low">Grave</option>
            <option value="high">Aigu</option>
          </select>
          <span class="hint">Donnez un motif différent à chaque profil.</span>
        </label>

        <label class="field" data-mode="voice">
          <span class="label">Langue de la voix</span>
          <select id="lang"></select>
        </label>

        <label class="field" data-mode="voice">
          <span class="label">Voix</span>
          <select id="voice"></select>
        </label>

        <div class="actions">
          <button id="test" type="button" class="primary">Tester</button>
          <output id="test-result" class="muted"></output>
        </div>
      </section>

      <section class="card">
        <h2>Sources Gmail</h2>
        <label class="switch">
          <input id="src-gmail-chat" type="checkbox" />
          <span><strong>Messages chat</strong><br /><span class="muted">Activé par défaut.</span></span>
        </label>
        <label class="switch">
          <input id="src-gmail-mail" type="checkbox" />
          <span><strong>Nouveaux e-mails</strong><br /><span class="muted">Désactivé par défaut : les e-mails sont nombreux.</span></span>
        </label>
        <p class="hint">Les autres sites (WhatsApp, LinkedIn, Slack…) sont toujours surveillés.</p>
      </section>

      <section class="card">
        <h2>Général</h2>
        <label class="switch">
          <input id="muted" type="checkbox" />
          <span><strong>Muet</strong><br /><span class="muted">Plus aucune annonce. Le dernier ping reste visible dans le popup.</span></span>
        </label>
        <label class="switch">
          <input id="debug" type="checkbox" />
          <span><strong>Mode DEBUG</strong><br /><span class="muted">Journalise dans la console de l'onglet Gmail les éléments candidats du chat, et dans celle du service worker les décisions de routage.</span></span>
        </label>
      </section>

      <p id="saved" class="saved" aria-live="polite"></p>
    </main>
    <script src="lib/parse.js"></script>
    <script src="lib/config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
